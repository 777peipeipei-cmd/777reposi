<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="競艇予想">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>🚤 競艇予想</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #fff;
      --border: #e0e0e0;
      --primary: #1565c0;
      --primary-dark: #0d47a1;
      --hit-bg: #fffde7;
      --hit-border: #f9a825;
      --text: #212121;
      --sub: #757575;
      --odds-hi: #e65100;
      --prob-hi: #1b5e20;
      --venue-bg: #1565c0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212; --card: #1e1e1e; --border: #333;
        --primary: #5c8fdb; --primary-dark: #1a237e;
        --hit-bg: #2d2300; --hit-border: #f9a825;
        --text: #e0e0e0; --sub: #9e9e9e;
        --odds-hi: #ffb74d; --prob-hi: #81c784;
        --venue-bg: #0d47a1;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; font-size: 14px; }

    /* ヘッダー */
    .header { background: var(--primary-dark); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
    .header h1 { font-size: 18px; letter-spacing: .5px; }
    .header-right { text-align: right; }
    .header-right .model-name { font-size: 11px; opacity: .75; }
    .header-right .updated { font-size: 11px; opacity: .75; }

    /* サブバー */
    .subbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; gap: 12px; align-items: center; font-size: 12px; flex-wrap: wrap; }
    .condition-badge { background: var(--primary-dark); color: #fff; padding: 3px 8px; border-radius: 12px; font-size: 11px; white-space: nowrap; }
    .filter-label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--sub); }
    .filter-label input { cursor: pointer; width: 16px; height: 16px; }
    .refresh-btn { background: var(--primary); color: #fff; border: none; padding: 6px 14px; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .refresh-btn:active { opacity: .7; }
    .notify-btn { background: transparent; color: var(--sub); border: 1px solid var(--border); padding: 5px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .notify-btn.on { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    .notify-btn:active { opacity: .7; }

    /* コンテンツ */
    .container { max-width: 640px; margin: 0 auto; padding: 8px; }

    /* 場ヘッダー */
    .venue-block { margin-top: 12px; }
    .venue-header { background: var(--venue-bg); color: #fff; padding: 9px 14px; border-radius: 10px 10px 0 0; font-size: 15px; font-weight: bold; }

    /* レースカード */
    .race-card { background: var(--card); border: 1px solid var(--border); border-top: none; }
    .race-card:last-child { border-radius: 0 0 10px 10px; }
    .race-header { padding: 7px 14px; background: rgba(21,101,192,.08); border-top: 1px solid var(--border); font-size: 13px; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .hit-star { color: var(--hit-border); }
    .deadline { font-size: 11px; font-weight: normal; color: var(--sub); }
    .deadline.imminent { color: #d32f2f; font-weight: bold; }
    .badge-imminent { background: #d32f2f; color: #fff; padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: bold; animation: pulse 1.5s ease-in-out infinite; }

    /* 艇行 */
    .boat-row { display: grid; grid-template-columns: 32px 1fr 56px 56px; gap: 6px; padding: 9px 12px; border-top: 1px solid var(--border); align-items: start; }
    .boat-row.hit { background: var(--hit-bg); border-left: 4px solid var(--hit-border); padding-left: 10px; }

    .boat-circle { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; margin-top: 2px; }
    .c1{background:#fff;color:#333;border:2px solid #bbb;}
    .c2{background:#222;color:#fff;}
    .c3{background:#e53935;color:#fff;}
    .c4{background:#1565c0;color:#fff;}
    .c5{background:#fdd835;color:#333;}
    .c6{background:#2e7d32;color:#fff;}

    .racer-info { overflow: hidden; }
    .racer-name { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
    .hit-badge { background: var(--hit-border); color: #fff; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; flex-shrink: 0; }
    .racer-sub { font-size: 11px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .val-col { text-align: right; }
    .val-main { font-size: 14px; font-weight: bold; }
    .val-label { font-size: 10px; color: var(--sub); }
    .hi-odds { color: var(--odds-hi); }
    .hi-prob { color: var(--prob-hi); }
    .odds-pending { color: var(--sub); font-size: 12px; }

    /* 信頼確度バッジ（Fix 1: 明確に表示） */
    .conf-badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 2px; user-select: none; -webkit-tap-highlight-color: transparent; }
    .conf-badge-hi  { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .conf-badge-mid { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
    .conf-badge-lo  { background: #f5f5f5; color: #757575; border: 1px solid #e0e0e0; }
    @media (prefers-color-scheme: dark) {
      .conf-badge-hi  { background: #1b3a1f; color: #81c784; border-color: #388e3c; }
      .conf-badge-mid { background: #3a2000; color: #ffb74d; border-color: #e65100; }
      .conf-badge-lo  { background: #2a2a2a; color: #9e9e9e; border-color: #444; }
    }

    /* 信頼度内訳パネル（Fix 6: タップで表示） */
    .conf-detail { display: none; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-top: 4px; font-size: 11px; }
    .conf-detail.open { display: block; }
    .conf-detail-row { display: flex; justify-content: space-between; padding: 2px 0; }
    .conf-detail-row:not(:last-child) { border-bottom: 1px solid var(--border); }
    .conf-detail-label { color: var(--sub); }
    .conf-detail-val { font-weight: bold; color: var(--text); }
    .conf-detail-note { color: var(--sub); font-size: 10px; margin-top: 4px; }

    /* 3連単ボックス */
    .trifecta-box { padding: 8px 12px 10px; border-top: 2px solid var(--primary); background: rgba(21,101,192,.04); }
    .trifecta-title { font-size: 11px; font-weight: bold; color: var(--primary); margin-bottom: 6px; }
    .trifecta-list { display: flex; flex-direction: column; gap: 4px; }
    .trifecta-row { display: flex; align-items: center; gap: 6px; }
    .trifecta-rank { width: 16px; font-size: 10px; color: var(--sub); flex-shrink: 0; text-align: right; }
    .trifecta-combo { display: flex; align-items: center; gap: 3px; }
    .t-boat { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; flex-shrink: 0; }
    .trifecta-arrow { font-size: 10px; color: var(--sub); }
    .trifecta-prob { margin-left: auto; font-size: 12px; font-weight: bold; color: var(--primary); }
    .trifecta-label { font-size: 10px; padding: 1px 5px; border-radius: 6px; font-weight: bold; flex-shrink: 0; }
    .lbl-top   { background: #f9a825; color: #fff; }
    .lbl-good  { background: #1565c0; color: #fff; }
    .lbl-ref   { background: #e0e0e0; color: #555; }

    /* 的中結果バナー（Fix 4） */
    .result-banner { margin: 0 12px 8px; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
    .result-hit  { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
    .result-miss { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
    .result-pending { background: rgba(21,101,192,.07); color: var(--primary); border: 1px solid rgba(21,101,192,.2); }
    @media (prefers-color-scheme: dark) {
      .result-hit  { background: #1b3a1f; color: #81c784; border-color: #388e3c; }
      .result-miss { background: #3a1515; color: #ef9a9a; border-color: #b71c1c; }
      .result-pending { background: rgba(92,143,219,.1); color: #5c8fdb; border-color: rgba(92,143,219,.3); }
    }

    /* キャリブレーションパネル */
    .calib-panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin: 12px 0; padding: 12px 14px; }
    .calib-title { font-size: 13px; font-weight: bold; color: var(--primary); margin-bottom: 8px; }
    .calib-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px solid var(--border); }
    .calib-row:last-child { border-bottom: none; }
    .calib-ok   { color: #2e7d32; font-weight: bold; }
    .calib-wait { color: var(--sub); }

    /* 閾値セレクター */
    .thresh-select { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
    .thresh-label { font-size: 11px; color: var(--sub); white-space: nowrap; }

    /* ローディング・エラー・空 */
    .loading { text-align: center; padding: 48px 16px; color: var(--sub); }
    .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { background: #ffebee; border: 1px solid #ef9a9a; border-radius: 8px; padding: 16px; margin: 12px; color: #b71c1c; line-height: 1.6; font-size: 13px; }
    .empty { text-align: center; padding: 40px 16px; color: var(--sub); font-size: 15px; }

    /* 自動更新インジケーター */
    .auto-badge { display: inline-block; width: 8px; height: 8px; background: #4caf50; border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  </style>
</head>
<body>

<div class="header">
  <h1>🚤 競艇予想</h1>
  <div class="header-right">
    <div class="model-name" id="model-name">読み込み中...</div>
    <div class="updated" id="updated-time"></div>
  </div>
</div>

<div class="subbar">
  <span class="condition-badge" id="cond-badge">条件取得中...</span>
  <label class="filter-label">
    <input type="checkbox" id="hit-only" onchange="render()">
    ★のみ
  </label>
  <label class="filter-label">
    <input type="checkbox" id="imminent-only" onchange="render()">
    締切間近のみ
  </label>
  <span class="auto-badge" title="3分ごと自動更新"></span>
  <span class="thresh-label">勝率</span>
  <select class="thresh-select" id="prob-thresh" onchange="onThreshChange()">
    <option value="0.10">10%</option>
    <option value="0.15">15%</option>
    <option value="0.20">20%</option>
    <option value="0.25">25%</option>
    <option value="0.30" selected>30%</option>
    <option value="0.35">35%</option>
    <option value="0.40">40%</option>
    <option value="0.45">45%</option>
    <option value="0.50">50%</option>
  </select>
  <span class="thresh-label">以上</span>
  <button class="notify-btn" id="calib-btn" onclick="toggleCalib()">📊 精度</button>
  <button class="notify-btn" id="notify-btn" onclick="toggleNotify()">🔔 通知OFF</button>
  <button class="refresh-btn" onclick="load(true)">今すぐ更新</button>
</div>

<div class="container" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div>データ取得中...</div>
  </div>
</div>

<script>
const DATE = '{{ date }}';
let _data = null;

// ─── 勝率閾値セレクター ────────────────────────────────────
function getProbThreshold() {
  return parseFloat(document.getElementById('prob-thresh').value || '0.30');
}

function onThreshChange() {
  const v = document.getElementById('prob-thresh').value;
  localStorage.setItem('probThreshold', v);
  render();
}

// ページ読み込み時に保存済み値を復元
(function initThresh() {
  const saved = localStorage.getItem('probThreshold');
  if (saved) {
    const sel = document.getElementById('prob-thresh');
    if (sel) sel.value = saved;
  }
})();

// HIT判定をクライアント側で計算（閾値変更に即座対応）
function calcHit(b) {
  const oddsOk  = b.odds && b.odds >= ((_data && _data.odds_threshold) || 100);
  const probOk  = b.win_prob >= getProbThreshold();
  return oddsOk && probOk;
}

// ─── 通知まわり ────────────────────────────────────────────
let _notifyOn = localStorage.getItem('notifyOn') === '1';
let _prevStatus = null;
let _notifiedHits = new Set();

function updateNotifyBtn() {
  const btn = document.getElementById('notify-btn');
  btn.textContent = _notifyOn ? '🔔 通知ON' : '🔔 通知OFF';
  btn.classList.toggle('on', _notifyOn);
}

async function toggleNotify() {
  if (!_notifyOn) {
    if ('Notification' in window && Notification.permission !== 'granted') {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        alert('通知が許可されませんでした。ブラウザの設定から許可してください。\n（iPhoneは「ホーム画面に追加」してから開くと通知できます）');
        return;
      }
    }
    _notifyOn = true;
    beep(); vibrate([100]);
    pushNotify('🔔 通知ON', '予想取得完了・★HIT発見時にお知らせします');
  } else {
    _notifyOn = false;
  }
  localStorage.setItem('notifyOn', _notifyOn ? '1' : '0');
  updateNotifyBtn();
}

function pushNotify(title, body) {
  if (!_notifyOn) return;
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body, icon: '/icon.svg', tag: 'boatrace', renotify: true });
    }
  } catch (e) {}
}

function vibrate(pattern) {
  if (_notifyOn && navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch (e) {}
  }
}

let _audioCtx = null;
function beep() {
  if (!_notifyOn) return;
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = _audioCtx.createOscillator();
    const g = _audioCtx.createGain();
    o.connect(g); g.connect(_audioCtx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, _audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + 0.4);
    o.start(); o.stop(_audioCtx.currentTime + 0.4);
  } catch (e) {}
}

function checkAndNotify() {
  if (!_data) return;
  const hits = [];
  for (const r of (_data.races || [])) {
    for (const b of (r.boats || [])) {
      if (b.hit) {
        const key = `${r.jcd}-${r.race_no}-${b.boat_no}`;
        if (!_notifiedHits.has(key)) {
          _notifiedHits.add(key);
          hits.push(`${r.venue}${r.race_no}R ${b.boat_no}号艇`);
        }
      }
    }
  }
  if (hits.length > 0) {
    beep(); vibrate([200, 100, 200]);
    pushNotify(`⭐ HIT ${hits.length}件！`, hits.slice(0, 4).join('\n'));
  }
  if (_prevStatus === 'fetching' && _data.status === 'done') {
    const total = (_data.races || []).length;
    const hitRaces = (_data.races || []).filter(r => r.has_hit).length;
    if (hits.length === 0) { beep(); vibrate([100]); }
    pushNotify('✅ 予想取得完了', `${total}レース取得 / ★HIT ${hitRaces}レース`);
  }
  _prevStatus = _data.status;
}

async function load(force = false) {
  const url = `/api/predictions?date=${DATE}${force ? '&force=1' : ''}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    _data = await res.json();
    render();
    checkAndNotify();
    if (_data.status === 'fetching') {
      setTimeout(() => load(), 3000);   // 取得中は3秒ごとに更新
    }
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<div class="error-box">
        ❌ 接続エラー: ${e.message}<br><br>
        <strong>自宅のWi-Fiに接続したPC/Mac</strong>でサーバーを起動してください。
      </div>`;
  }
}

// ─── 締切時刻からリアルタイムに残り分を計算（Fix 3） ─────
function calcMinutesLeft(deadlineStr) {
  if (!deadlineStr) return null;
  const m = deadlineStr.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const now = new Date();
  const ddl = new Date(now);
  ddl.setHours(parseInt(m[1]), parseInt(m[2]), 0, 0);
  return (ddl - now) / 60000;
}

function render() {
  if (!_data) return;

  document.getElementById('model-name').textContent = `モデル: ${_data.model}`;
  document.getElementById('updated-time').textContent = `更新: ${_data.updated}`;
  const tPct = (getProbThreshold() * 100).toFixed(0);
  document.getElementById('cond-badge').textContent =
    `オッズ>${_data.odds_threshold}倍 かつ 予測勝率>${tPct}%`;

  if (_data.error) {
    document.getElementById('app').innerHTML = `<div class="error-box">❌ ${_data.error}</div>`;
    return;
  }

  if (_data.status === 'fetching') {
    const prog = _data.progress || 'データ取得中...';
    const done = (_data.races || []).length;
    document.getElementById('updated-time').textContent = `${prog} (取得済 ${done}R)`;
  }

  const hitOnly = document.getElementById('hit-only').checked;
  const imminentOnly = document.getElementById('imminent-only').checked;
  const fetching = _data.status === 'fetching';
  const grace = _data.closed_grace_min || 2;

  let races = (_data.races || []);
  // has_hit をクライアント側で再計算（閾値変更に即対応）
  races = races.map(r => ({
    ...r,
    boats: r.boats.map(b => ({ ...b, hit: calcHit(b) })),
  }));
  races = races.map(r => ({ ...r, has_hit: r.boats.some(b => b.hit) }));
  if (hitOnly) races = races.filter(r => r.has_hit);

  // Fix 3: 締切フィルターをリアルタイムで計算（取得中でも適用）
  if (imminentOnly) {
    races = races.filter(r => {
      const ml = calcMinutesLeft(r.deadline);
      if (ml === null) return true;   // 締切不明は表示
      return ml >= -grace;            // grace分以内なら表示
    });
  }

  if (races.length === 0) {
    let empty;
    if (fetching) {
      empty = `<div class="loading"><div class="spinner"></div><div>${_data.progress || 'データ取得中...'}<br><small>出走表を取得できたレースから順次表示されます</small></div></div>`;
    } else if (imminentOnly) {
      empty = `<div class="empty">⏱ 締切${_data.imminent_window}分前のレースは今ありません</div>`;
    } else if (hitOnly) {
      empty = `<div class="empty">⭐ 条件を満たす艇はまだありません</div>`;
    } else {
      empty = `<div class="empty">実施中のレースがありません</div>`;
    }
    document.getElementById('app').innerHTML =
      renderCalibPanel(_data.calib_stats) + empty;
    return;
  }

  const venues = {};
  const order = [];
  for (const r of races) {
    if (!venues[r.jcd]) { venues[r.jcd] = { name: r.venue, races: [] }; order.push(r.jcd); }
    venues[r.jcd].races.push(r);
  }

  let html = '';
  for (const jcd of order) {
    const v = venues[jcd];
    html += `<div class="venue-block"><div class="venue-header">📍 ${v.name}</div>`;
    for (const race of v.races) html += renderRace(race, hitOnly);
    html += '</div>';
  }
  document.getElementById('app').innerHTML =
    renderCalibPanel(_data.calib_stats) + html;
}

function renderRace(race, hitOnly) {
  const boats = hitOnly ? race.boats.filter(b => b.hit) : race.boats;

  // 締切時刻・残り時間（リアルタイム計算）
  let timeInfo = '';
  if (race.deadline) {
    const ml = calcMinutesLeft(race.deadline);
    let left = '';
    if (ml !== null) {
      left = ml <= 0 ? '締切' : `あと${Math.round(ml)}分`;
    }
    const isImm = ml !== null && ml >= 0 && ml <= (_data.imminent_window || 5);
    const cls = isImm ? 'deadline imminent' : 'deadline';
    timeInfo = `<span class="${cls}">⏱ ${race.deadline} ${left}</span>`;
    if (isImm) timeInfo += '<span class="badge-imminent">締切間近</span>';
  }

  let html = `<div class="race-card">
    <div class="race-header">
      <span>${race.race_no}R</span>
      ${timeInfo}
      ${race.has_hit ? '<span class="hit-star">⭐</span>' : ''}
    </div>`;

  // Fix 4: 的中結果バナー
  html += renderResultBanner(race);

  for (const b of boats) {
    html += renderBoatRow(b, race);
  }

  // 3連単セクション（★HIT艇が1着の場合のみ表示）
  if (race.has_hit && race.trifecta && race.trifecta.length > 0) {
    const hitNos = race.boats.filter(b => b.hit).map(b => b.boat_no).join('・');
    html += `<div class="trifecta-box">
      <div class="trifecta-title">🎯 3連単（★HIT ${hitNos}号艇を1着に固定・最大6点）</div>
      <div class="trifecta-list">`;
    race.trifecta.forEach((t, idx) => {
      const lbl = t.label === '最有力' ? 'lbl-top' : (t.label === '有力' ? 'lbl-good' : 'lbl-ref');
      const bts = t.combo.map(n =>
        `<div class="t-boat c${n}">${n}</div>`
      ).join('<span class="trifecta-arrow">→</span>');
      html += `
        <div class="trifecta-row">
          <div class="trifecta-rank">${idx + 1}</div>
          <div class="trifecta-combo">${bts}</div>
          <span class="trifecta-label ${lbl}">${t.label}</span>
          <div class="trifecta-prob">${t.prob}%</div>
        </div>`;
    });
    html += `</div></div>`;
  }

  return html + '</div>';
}

// Fix 4: 的中結果バナーを生成
function renderResultBanner(race) {
  if (!race.result || Object.keys(race.result).length === 0) {
    // 締切済みで結果待ち
    const ml = calcMinutesLeft(race.deadline);
    if (ml !== null && ml < -(_data.closed_grace_min || 2)) {
      return `<div class="result-banner result-pending">⏳ 結果集計待ち...</div>`;
    }
    return '';
  }

  // 結果あり: 1着を特定
  const resultEntries = Object.entries(race.result);
  const winnerEntry = resultEntries.find(([k, v]) => v === 1);
  if (!winnerEntry) return '';
  const winnerBoat = parseInt(winnerEntry[0]);

  // HIT艇が勝ったか確認
  const hitBoats = race.boats.filter(b => b.hit).map(b => b.boat_no);
  const hitWon = hitBoats.includes(winnerBoat);
  const hasHit = hitBoats.length > 0;

  if (hasHit) {
    if (hitWon) {
      return `<div class="result-banner result-hit">✅ 的中！ 1着：${winnerBoat}号艇</div>`;
    } else {
      return `<div class="result-banner result-miss">❌ 不的中 1着：${winnerBoat}号艇 (予測：${hitBoats.join('・')}号艇)</div>`;
    }
  } else {
    return `<div class="result-banner result-pending">📋 結果 1着：${winnerBoat}号艇</div>`;
  }
}

// Fix 1 + Fix 6: 信頼度バッジとタップで詳細表示
function renderBoatRow(b, race) {
  const ex  = b.ex_time ? b.ex_time.toFixed(2) : '--.--';
  const mtr = b.motor_rate ? (b.motor_rate * 100).toFixed(1) + '%' : '--';
  const nwr = b.national_win_rate ? b.national_win_rate.toFixed(2) : '--';
  const oddsStr = b.odds ? b.odds.toFixed(1) : '---';
  const prob = (b.win_prob * 100).toFixed(1) + '%';
  const conf = (b.confidence !== undefined && b.confidence !== null) ? b.confidence : null;
  const confLabel = b.conf_label || '--';

  // Fix 1: バッジスタイルを改善
  const badgeCls = confLabel === '高' ? 'conf-badge-hi' : (confLabel === '中' ? 'conf-badge-mid' : 'conf-badge-lo');
  const detailId = `cd-${race.jcd}-${race.race_no}-${b.boat_no}`;

  const confBadge = conf !== null
    ? `<div class="conf-badge ${badgeCls}" onclick="toggleConf('${detailId}')">
        信頼${confLabel} ${conf}% ▾
       </div>
       <div id="${detailId}" class="conf-detail">
         ${renderConfDetail(b)}
       </div>`
    : '';

  return `
    <div class="boat-row ${b.hit ? 'hit' : ''}">
      <div class="boat-circle c${b.boat_no}">${b.boat_no}</div>
      <div class="racer-info">
        <div class="racer-name">
          ${escHtml(b.racer)}
          ${b.hit ? '<span class="hit-badge">★HIT</span>' : ''}
        </div>
        <div class="racer-sub">${b.class} 勝率${nwr} | ${b.course}コース 展示${ex} | モーター${mtr}</div>
        ${confBadge}
      </div>
      <div class="val-col">
        <div class="val-main ${b.odds && b.odds >= 100 ? 'hi-odds' : ''}">${oddsStr}${b.odds ? '倍' : ''}</div>
        <div class="val-label">オッズ</div>
      </div>
      <div class="val-col">
        <div class="val-main ${b.win_prob >= (_data.prob_threshold || 0.3) ? 'hi-prob' : ''}">${prob}</div>
        <div class="val-label">予測勝率</div>
      </div>
    </div>`;
}

// Fix 6: 信頼度計算式の内訳
function renderConfDetail(b) {
  const br = b.conf_breakdown;
  if (!br) return '<div class="conf-detail-note">内訳データなし</div>';
  const items = ['展示T', 'モーター', '勝率', 'コース'];
  const present = br.completeness_items;
  return `
    <div class="conf-detail-row">
      <span class="conf-detail-label">① データ完全性 (${present}/4項目)</span>
      <span class="conf-detail-val">${br.completeness_score}点 /35点</span>
    </div>
    <div class="conf-detail-row">
      <span class="conf-detail-label">② 予測余裕 (勝率${br.win_prob_pct}%)</span>
      <span class="conf-detail-val">${br.margin_score}点 /35点</span>
    </div>
    <div class="conf-detail-row">
      <span class="conf-detail-label">③ 支配度 (1位-2位差 ${br.gap_pct}%)</span>
      <span class="conf-detail-val">${br.dominance_score}点 /30点</span>
    </div>
    <div class="conf-detail-row">
      <span class="conf-detail-label">モデル係数 (${br.model_name})</span>
      <span class="conf-detail-val">×${br.model_base}</span>
    </div>
    <div class="conf-detail-row">
      <span class="conf-detail-label">生スコア → 補正後</span>
      <span class="conf-detail-val">${br.raw_score}% → ${b.confidence}%</span>
    </div>
    <div class="conf-detail-note">※ 10件以上蓄積後にキャリブレーション補正が有効になります</div>`;
}

function toggleConf(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── キャリブレーションパネル ────────────────────────────────
let _showCalib = false;

function toggleCalib() {
  _showCalib = !_showCalib;
  document.getElementById('calib-btn').classList.toggle('on', _showCalib);
  render();
}

function renderCalibPanel(stats) {
  if (!_showCalib || !stats || stats.length === 0) return '';
  let html = `<div class="calib-panel">
    <div class="calib-title">📊 信頼度キャリブレーション状況</div>
    <div class="calib-row" style="font-weight:bold">
      <span>信頼度帯</span><span>補正係数</span><span>サンプル数</span><span>状態</span>
    </div>`;
  for (const r of stats) {
    const okCls = r.status === '補正中' ? 'calib-ok' : 'calib-wait';
    html += `<div class="calib-row">
      <span>${r.bucket}</span>
      <span>${r.factor.toFixed(2)}×</span>
      <span>${r.samples}件</span>
      <span class="${okCls}">${r.status}</span>
    </div>`;
  }
  html += `<div style="font-size:11px;color:var(--sub);margin-top:6px">
    ※ 10件以上蓄積されると自動的に補正が始まります
  </div></div>`;
  return html;
}

updateNotifyBtn();
load();
setInterval(() => load(), 3 * 60 * 1000); // 3分ごと自動更新
